name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm run test:server

      - name: Check server syntax
        run: node --check server.js

  frontend:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run frontend:verify

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run visual tests
        run: npm run frontend:visual

      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-visual-${{ github.sha }}
          path: test-results/**/showcase-*.png
          if-no-files-found: error
          retention-days: 14
