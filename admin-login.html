<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 | 케이트블랑</title>
  <link rel="stylesheet" href="css/admin-login.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="brand">Kate Blanc</p>
      <h1 id="login-title">관리자 로그인</h1>
      <p class="description">등록된 관리자 계정으로 로그인해 주세요.</p>

      <form id="adminLoginForm">
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="loginError" class="error" role="status" aria-live="polite"></p>
        <button id="loginSubmit" type="submit">
          <span class="button-label">로그인</span>
          <span class="button-loading" hidden>확인 중…</span>
        </button>
      </form>
    </section>
  </main>
  <script src="js/admin-login.js"></script>
</body>
</html>
